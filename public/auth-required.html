<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090909" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · Home</title>
    <style>
      :root {
        color-scheme: dark;
        background: #090909;
        color: #f4f1ec;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      ::selection { color: #fff6eb; background: #834627; }
      .page {
        --gutter: clamp(24px, 6vw, 96px);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding: 32px var(--gutter);
      }
      header, main { width: min(100%, 1160px); margin-inline: auto; }
      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        color: #9e9b97;
        font-size: 13px;
        line-height: 24px;
        text-decoration: none;
      }
      .home-mark { display: grid; grid-template-columns: repeat(2, 4px); gap: 2px; }
      .home-mark i { height: 4px; background: #9e9b97; }
      .home-mark i:last-child { background: #4c4a47; }
      main { flex: 1; display: flex; align-items: center; padding-block: 32px 64px; }
      .copy { max-width: 38rem; }
      h1 {
        margin: 0;
        font-size: clamp(44px, 5.1vw, 76px);
        font-weight: 400;
        line-height: 1.06;
        letter-spacing: -0.04em;
      }
      p { margin: 24px 0 0; color: #a29d97; font-size: 16px; line-height: 1.5; }
      .sign-in {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 32px;
        padding: 12px 20px;
        border-radius: 6px;
        background: #fb8d48;
        color: #090909;
        font-size: 15px;
        line-height: 24px;
        text-decoration: none;
      }
      .sign-in:hover { background: #ffa466; }
      .sign-in:active { background: #ed7b37; }
      .home-link:hover { color: #f4f1ec; }
      a:focus-visible { outline: 2px solid #fb8d48; outline-offset: 5px; }
      @media (max-width: 900px) {
        .page { padding-block: 24px; }
        header, main { max-width: 520px; }
        main { padding-block: 56px 64px; }
        h1 { font-size: clamp(38px, 9.8vw, 52px); }
        p { margin-top: 16px; font-size: 15px; }
        .sign-in { margin-top: 28px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="home-link" href="https://www.prfnv.com/">
          <span class="home-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          Home
        </a>
      </header>
      <main>
        <div class="copy">
          <h1>Sign in.</h1>
          <p>Your services. A space just for you.</p>
          <a class="sign-in" href="/sign-in">Continue with Google</a>
        </div>
      </main>
    </div>
  </body>
</html>
